# FLEET-WIDE DEFAULTS. Applies to every camera stream.
#
# Per-camera overrides live in cameras/<id>.yaml and are deep-merged on top of
# this file - see src/config.py::load_for_camera. A camera may override any key
# here EXCEPT the fleet-wide ones (storage.*, frames.format, frames.retention,
# perception.model.name/device, analysis.*), which are rejected with a warning.
#
# Run one camera:  python main.py --camera demo

camera:
  id: "demo"             # cameras/<id>.yaml, and the {camera_id} in output paths
  name: "demo"           # what a human reads in the report

  # WHERE THIS CAMERA IS. Set it per camera in cameras/<id>.yaml, not here.
  #
  # Used for one thing, and it is worth more than it looks: the haversine
  # distance between two cameras divided by the time between two sightings
  # gives an implied speed for that hop, and anything above
  # journey.max_speed_kmh is an OCR collision or a cloned plate rather than a
  # journey. That recovers most of what a road-topology graph would be wanted
  # for, with no topology file to maintain.
  #
  # null/null means "unknown", and a hop to or from such a camera reports no
  # distance rather than 0 km - a 0 km hop would silently pass the very check
  # above. The value is SNAPSHOT onto the run row when a run starts, so editing
  # this file later cannot retroactively move a historical sighting.
  location:
    lat: null            # e.g. 12.9716
    lon: null            # e.g. 77.5946

video:
  # A camera normally declares its own `source` in cameras/<id>.yaml, so its
  # geometry cannot be paired with the wrong footage. --source overrides.
  source: "samples/short/input.mp4"
  target: "outputs/{camera_id}/annotated.mp4"
  csv: "outputs/{camera_id}/tracks.csv"
  summary: "outputs/{camera_id}/summary.txt"
  write_video: true

  # WHEN THE FOOTAGE STARTS - unix epoch, or ISO-8601 ("2026-09-12T08:30:00",
  # read in local time if it carries no offset). --recorded-at overrides.
  #
  # FILE SOURCES ONLY, and they need it to take part in any cross-camera
  # question at all. A file's frame timestamps are seconds-from-clip-start, so
  # every clip begins at 0 and camera A@12.4s vs camera B@8.1s says nothing
  # about which happened first. This anchors them to real time. Live sources
  # are already on wall-clock and ignore this.
  #
  # Leaving it null is legal and honest: those sightings are reported by
  # `query.py --path` as unorderable and set aside, rather than guessed at.
  # Storing the PROCESSING time instead would not fix it - see src/timebase.py
  # for why that encodes GPU speed rather than traffic.
  recorded_at: null

source:                  # live sources only (rtsp:// / http:// / webcam index)
  reconnect: true        # RTSP drops routinely; reconnect with backoff
  max_retries: 0         # 0 = retry forever
  backpressure: null     # null = auto (drop_oldest for live, buffer_all for files)
                         #   drop_oldest = keep newest frame, latency stays flat
                         #   buffer_all  = lose nothing, latency may grow
  queue_size: null

processing:
  max_frames: -1         # -1 = all frames, else first N (quick test)
  analyse_fps: null      # frames per second to ANALYSE, independent of the
                         # source rate. null = every frame. 5 on a 30fps feed
                         # analyses 5/sec and skips the rest.
  evict_every: 150       # sweep retired tracks every N analysed frames

# ===========================================================================
# PERCEPTION - the common stage. Detect -> track -> attributes, once per frame.
# Everything below produces the objects that EVERY analysis then reads, so an
# analysis can filter on an attribute (trucks only, red vehicles only).
# ===========================================================================
perception:
  model:
    name: "yolov8n.pt"   # swap to yolov8s.pt / yolov8m.pt / custom.pt (heavy: GPU)
    conf: 0.3            # min confidence 0-1. Lower = more boxes, more mistakes.
    iou: 0.5             # merges overlapping boxes
    imgsz: 640           # analysis size. Lower (480) = faster on CPU.
    device: "cpu"        # "cpu" on a laptop, "cuda" / 0 on GPU
    classes: null        # null = ALL 80 COCO classes ("anything on road").
                         # Also accepts "vehicle" / "on_road" (a class group),
                         # ["car","truck"] (names), or the old [2,3,5,7] (ids).
                         # NOTE: COCO has no pothole/debris/cone/barrier class -
                         # those are not misdetected, they are invisible.

  tracker:
    name: "bytetrack.yaml"
    persist: true
    track_buffer: 30

  # Attribute enrichers, in run order. These are NOT analyses: they add facts
  # to tracked objects before any analysis runs. Turn one off per camera with
  # enabled: false (e.g. a camera too far away for plates).
  attributes:
    color:
      enabled: true      # vehicle paint (HSV), person shirt/trousers

    plate:               # number plate: YOLO finds the box, an OCR backend reads it
      enabled: true
      det_conf: 0.3      # plate-box threshold. Lower = more boxes, more junk OCR.
      min_conf: 0.5      # OCR text below this is rejected as unreadable.
      det_imgsz: 480     # detector size. Lower = faster, misses small plates.

      # WHICH READER. Compare them yourself: python tools/bench_ocr.py
      #   fast_plate  - THE DEFAULT HERE. Plate-specific, tiny, fastest, and
      #                 nothing to download: it ships with the pip install.
      #   paddle_anpr - more accurate, and the better choice IF you install it.
      #                 Needs three things pip cannot provide (see the note at
      #                 the bottom of requirements.txt): paddlepaddle +
      #                 safetensors + scikit-image, ~150 MB of weights, and a
      #                 PaddleOCR source checkout.
      #   rapidocr    - generic text reader. Fallback only; far the weakest.
      # Character error rate on samples/plate_gt.csv (5 plates, lower better):
      #   paddle_anpr 0.19  |  fast_plate 0.54  |  rapidocr 0.88
      #
      # WHY THE DEFAULT IS NOT THE MOST ACCURATE ONE. paddle_anpr was the
      # default and is not installable by `pip install -r requirements.txt`,
      # so out of the box it failed to load and NO plates were read - on the
      # dashboard that appeared as an empty plate column with no explanation.
      # Defaulting to the backend that works means plate reading is on for
      # anyone who just clones and runs. Switch to paddle_anpr once installed;
      # `/cameras` reports which backend actually loaded, and the dashboard
      # shows a banner when it did not.
      ocr_backend: "fast_plate"
      ocr_model: ""      # backend-specific model name. "" = that backend's default.

      # HOW MANY FRAMES TO READ PER VEHICLE. The plate is biggest the moment it
      # clears the bottom of the frame, but that is also its most slanted and
      # most motion-blurred view - measured here the reading is most reliable
      # ~10 frames later on a slightly smaller plate. So sample across the
      # vehicle instead of trusting the biggest crop.
      read_every: 3      # OCR every 3rd frame in which the plate is readable
      max_reads: 8       # ...up to this many per vehicle (CPU budget)
      vote: true         # combine reads character-by-character: the same plate
                         # reads differently frame to frame and the errors move
                         # around, so the majority is usually right.
      vote_min_conf: 0.8 # only confident reads vote. Voting over every frame is
                         # WORSE than not voting: distant views are junk.
      format_correction: true  # fix OCR mix-ups using the Indian plate format
                         # (MH12AB1234). Indian plates never use I or O in the
                         # letter part - too close to 1 and 0 - so a "0" where a
                         # letter belongs is almost certainly a D. Fixes at most
                         # ONE character; a plate fitting no known format is
                         # left exactly as read, never guessed at.
      join_rows: true    # two-row (bike) plates: read BOTH rows and join them.

    person:              # people: which way they face, sleeves, trousers/shorts/
      enabled: true      # skirt, bag, hat, glasses. One 7MB model (PP-Human
                         # PPLCNet, Apache-2.0), whole-body crop - never the face.
                         # Without the model it says so and everything else runs.
                         # Fetch: python tools/fetch_person_attr.py
      model: "models/person_attr/person_attr.onnx"

      # WHAT IS STORED. Field test on 3 clips: facing + sleeves were right on
      # all of them; lower/bag/hat/glasses only in good conditions (filter on
      # <key>_conf). The model also decodes gender, age_group, long_coat,
      # holding, upper_pattern, lower_pattern, boots - NOT stored by default
      # because they were confidently wrong (women in headscarves read male
      # at up to 0.97; elderly read 18-60; T-shirts read as long coats).
      keys: [facing, sleeves, lower, bag, hat, glasses]

      # WHICH CROPS ARE READ. A bad crop gives a confident wrong answer.
      min_height: 80     # px. Smaller people are skipped: too few pixels to judge.
      min_width: 30
      edge_margin: 4     # skip people touching the frame edge (half a body)
      min_det_conf: 0.35 # skip weak person detections (a road sign read as a person)
      max_umbrella_cover: 0.25  # skip when an umbrella box hides >25% of the person

      read_every: 3      # model every 3rd usable frame of a person...
      max_reads: 8       # ...up to this many; the values are the AVERAGE of reads
      min_reads: 3       # store nothing until a person has this many usable reads
      thresholds:        # yes/no cut-offs per model label (default 0.5)
        Glasses: 0.6     # PP-Human's own 0.3 let through mostly-wrong guesses
      threads: 1         # onnxruntime threads per call (the stage is already pooled)

    # EXPERIMENTAL, heavier person models - off until tested on Indian footage.
    # Setup once: python tools/fetch_person_models.py
    # Compare all three: python tools/eval_person_models.py --help
    garments:            # SegFormer-B2 clothes parsing (MIT). Per pixel, so it
      enabled: false     # tells a headscarf (scarf) from a hat, and skirt/dress/
                         # trousers/shorts. ~0.6 s per read on 4 threads.
      min_height: 120
      read_every: 6
      max_reads: 3
      min_reads: 2
      threads: 4

    age_gender:          # MiVOLO v2 (Apache-2.0), BODY ONLY - no face used.
      enabled: false     # Apparent age in years + gender. Needs torch,
                         # transformers==4.51.0, timm==0.9.2.
      min_height: 100
      read_every: 6
      max_reads: 3
      min_reads: 2
      threads: 4

# ===========================================================================
# ANALYSES - independent consumers of the objects perception produced.
# Each has its own `enabled`, so a camera can switch one off without touching
# the others. Congestion, wrong-way and counting do not know about each other.
# ===========================================================================
analyses:
  counting:
    enabled: true
    vehicles_only: true  # count vehicles only, not people/animals
    zones:               # two lines: A (entry side) and B (exit side)
      enabled: true
      line_a_ratio: 0.35 # upper line (exit side, top)
      line_b_ratio: 0.65 # lower line (entry side, bottom)
      label_a: "bottom (entry)"
      label_b: "top (exit)"
      color_a: [255, 0, 0]
      color_b: [0, 255, 255]

  # WRONG-SIDE DETECTION ----------------------------------------------------
  # This used to carry two polygons hand-tuned on samples/short/input.mp4, and every
  # other source silently inherited them. On Indian test footage that divider
  # cut through the middle of a single one-way carriageway: 2 of 90 vehicle
  # tracks were reported wrong-way, both driving correctly. So the default is
  # to MEASURE the geometry rather than assert it.
  lanes:
    enabled: true
    mode: "auto"
    #   auto     learn the lanes and divider from motion during a warmup
    #            window. Nothing is invented: if only one direction of travel
    #            is observed you get ONE carriageway with a known flow, not a
    #            made-up oncoming lane. Right for an uncalibrated clip.
    #   explicit use the `lanes:` list below and CHECK it against motion during
    #            the same window. A lane whose traffic demonstrably flows the
    #            other way is reported at startup - see rules.on_mismatch.
    #   off      no lane or wrong-way analysis.
    #
    # Per camera: python tools/calibrate.py --suggest-lanes --source <video> \
    #               --out cameras/<id>.yaml          (measured)
    #             python tools/draw_lanes.py --source <video>   (by hand)
    units: "auto"        # ratio | pixel | auto (per-lane override too)
    lanes: []            # used when mode is explicit. `flow` is a VECTOR and is
                         # preferred over `direction` ("up"/"down"): a camera on
                         # a pole sees the road running diagonally and no
                         # cardinal name describes it. See cameras/demo.yaml.
    divider: null        # the coming/going boundary as a LINE, not the shared
                         # edge of two polygons. Drawn across the whole frame
                         # when present, so a divider in the wrong place is
                         # obvious at a glance.
                         #   divider: {points: [[0.34, 0.0], [0.05, 1.0]]}
    rules:
      warmup_frames: 300      # frames spent MEASURING before any alert can
                              # fire. Also what gives each track enough history
                              # for a heading, so nothing is flagged on frame 1.
                              # Measured: 120 frames of Indian test footage
                              # attributed only 4 tracks to the misconfigured
                              # lane - too thin to call the mismatch; 200 frames
                              # gave 8 tracks and called it clearly.
      on_mismatch: "suppress" # a configured lane whose traffic demonstrably
                              # flows the other way. What to do about THAT LANE:
                              #   suppress = stop wrong-way checking on it, keep
                              #              everything else running (default)
                              #   flip     = trust the measurement, correct its
                              #              flow to the observed direction
                              #   warn     = say so loudly but alert anyway
                              #   off      = disable lane analysis for the run
      # --- the wrong-side rule ---------------------------------------------
      history: 8              # samples of ground-point history behind a
                              # heading. A single-frame difference is noise:
                              # the far half of these clips moves 1-2 px/frame.
      min_travel_px: 6.0      # travel over the window before a heading is
      min_travel_rel: 0.15    # trusted: max(min_travel_px, this * box height).
                              # The old gate was a flat 4 px per frame, which
                              # 96% of far-object frames and 68% of near-object
                              # frames never reached - blind where it mattered.
      align_cos: 0.5          # cosine between travel and lane flow. Past -0.5
                              # is wrong-way, past +0.5 is with the flow,
                              # between is sideways and gets NO verdict (a lane
                              # change must not read as wrong-way).
      edge_px: 2              # ignore a box within this many px of a frame
                              # edge: its bottom-centre is not where it is.
      max_gap_frames: 5       # a track the detector LOST and re-acquired is
                              # not one observation. Measured on a full run:
                              # track 349 vanished for 26 frames and came back
                              # 218 px lower, which the velocity window read as
                              # downward travel - the run's only wrong-way
                              # alert, on a vehicle driving correctly.
      max_step_rel: 1.5       # within a small gap: one step longer than this
                              # many of the object's own heights is a detector
                              # jump or an id switch, not motion. Real motion
                              # peaks near 0.2 box-heights per frame.
      divider_margin_rel: 0.35    # keep-out band around the divider and the
      divider_margin_min_px: 6.0  # lane boundary, as a fraction of the
      lane_margin_rel: 0.15       # object's own height. Replaces a flat 14 px,
      lane_margin_min_px: 4.0     # which was metres of road at frame top.
      confirm_window: 8       # confirm wrong-way on `confirm_count` opposing
      confirm_count: 5        # samples out of the last `confirm_window` - NOT
                              # consecutive. A vehicle crawling the wrong way
                              # down a jammed road kept resetting the old streak.
      # --- how the warmup survey decides what it saw ------------------------
      survey_min_samples: 6       # frames a track needs before it votes
      survey_min_travel_px: 25.0  # and how far it must have travelled
      survey_min_travel_rel: 0.5  # (or this much of its own box height)
      opposing_min_tracks: 3      # a second carriageway is only believed with
      opposing_min_frac: 0.12     # at least this many / this fraction of tracks
                                  # going the other way. Below it: one carriageway.

  congestion:
    enabled: false       # set true per camera, or here for the whole fleet
    busy_count: 6
    heavy_count: 12
    jam_occupancy: 0.28
    slow_px_per_frame: 2.0
    min_frames: 15       # a level must PERSIST this long before it is reported,
                         # so one noisy frame does not raise an alert
    draw: true

# ===========================================================================
# INFRASTRUCTURE - fleet-wide. A camera file cannot override these.
# ===========================================================================
analysis:                # how the stages are SCHEDULED, not what they do
  parallel: false        # run the compute phase of concurrent-safe plugins on
                         # worker threads. The win is in perception: plate OCR
                         # is tens of ms of ONNX per frame. The three analyses
                         # are a few dozen float ops each and barely benefit.
  workers: null          # null = one per concurrent plugin

storage:
  backend: "sqlite"
  path: "outputs/traffic.db"   # SHARED by every camera, by design: durable
                               # vehicle identity (reid) is keyed on the plate
                               # and works across cameras pointed at one DB.
  batch_rows: 500        # commit after this many rows...
  commit_interval: 2.0   # ...or this many seconds. Worst case loss on a kill.
  csv_export: true       # keep writing the per-camera tracks.csv too

frames:                  # EVERY analysed frame is stored raw AND annotated
  enabled: true
  format: "jpeg"         # jpeg     = one file per frame per variant (right for a clip)
                         # segments = rolling H.264, same every-frame guarantee.
                         # MEASURED at 1080p: 378 KB/frame at q85 => ~2 TB/day
                         # raw+annotated at 30fps, vs ~130 GB/day as segments.
                         # Switch before pointing this at a permanent stream.
  dir: "outputs/{camera_id}/frames"
  quality: 85
  encode_workers: 3
  segment_seconds: 300
  retention:
    max_age_hours: 0     # 0 = keep everything
    max_disk_gb: 0       # 0 = no cap; set both for a rolling window
    check_interval: 60

objects:                 # one image per detected object
  save_crops: true
  crop_min_conf: 0.5
  crop_dir: "outputs/{camera_id}/crops"

reid:                    # DURABLE IDENTITY - the same car keeps one id
  # ByteTrack matches on motion and box overlap only. It holds a lost track for
  # ~1s then deletes it, so a vehicle that leaves the frame and comes back gets
  # a NEW track id and is counted as a new object. The number plate is the only
  # identity that survives an absence, so it is the key: plate -> a stable
  # vehicle id, kept in the `vehicles` table and reused across runs AND across
  # cameras pointed at the same DB.
  #
  # Track id still means "one sighting" and every sighting still gets its own
  # objects row, so counting is unaffected. objects.vehicle_id ties them together.
  enabled: true
  min_conf: 0.7          # plate confidence needed to key an identity on.
                         # Higher than plate.min_conf (0.5) on purpose: a read
                         # good enough to PRINT on a box is not good enough to
                         # merge two vehicles' histories on. A wrong caption is
                         # one bad frame; a wrong merge is permanent.
  require_format: true   # only bind plates that cleanly fit a real Indian
                         # registration template. false falls back to the loose
                         # "has letters and digits" check, which the 'IND' band
                         # on an HSRP plate also passes.
  fuzzy_distance: 0      # 0 = exact match only, and leave it there unless you
                         # have measured otherwise. Real plates differ by one
                         # character (...8337 and ...8338 are two cars), so
                         # near-match merging fuses strangers rather than
                         # repairing OCR noise.
  cache_size: 4096       # plate -> id LRU. A miss costs one indexed lookup, so
                         # this only has to cover the plates in flight; the cap
                         # is what keeps a 24/7 feed's memory flat.

journey:                 # MULTI-CAMERA ROUTES (offline; see src/journeys.py)
  # `query.py --path V` reconstructs where one car went across the fleet from
  # the sightings that resolved to the same vehicle id. It reports only
  # OBSERVED hops: the stretch between two cameras is printed as a gap, never
  # as an inferred route, and no intermediate camera is ever asserted.
  #
  # Read `query.py --yield` FIRST. Cross-camera identity needs two cameras to
  # produce character-identical voted plates (fuzzy_distance is 0 above), so
  # the honest expectation is a sparse, noisy hop set. If the yield is zero,
  # the work to do is plate accuracy, not route assembly.
  max_gap_s: 1800        # idle seconds that end one trip and begin another.
                         # A car at camera A in the morning and at A again at
                         # night made two trips; it did not loop. Measured from
                         # LEAVING one camera to ARRIVING at the next, so a long
                         # dwell in one camera's view does not split a trip.
  max_speed_kmh: 150     # implied-speed ceiling per hop (haversine distance
                         # over elapsed time). Above this, the two sightings are
                         # not one car. Such hops are FLAGGED, never dropped: a
                         # bad plate merge is worth seeing, and deleting it
                         # would leave a plausible-looking route with no sign
                         # that its identity is wrong. Needs camera.location at
                         # both ends; without it a hop cannot be speed-checked.

server:                  # THE SERVICE (serve.py). Fleet-wide: a camera file
                         # cannot move the listen address out from under you.
  # There is NO application-level authentication, by decision. This is
  # protected by network placement only, and three endpoints make that
  # decision matter: /crops serves plate imagery, /live streams plate strings,
  # and /stream serves live road footage. Binding wider publishes all three.
  host: 127.0.0.1        # never 0.0.0.0 by default. --host says so out loud.
  port: 8000
  push_hz: 8             # metadata WebSocket rate, independent of
                         # processing.analyse_fps. Nobody reads 30 updates a
                         # second, and a file replaying at 3x would flood it.
  video:
    # The MJPEG stream the dashboard draws its boxes over. The boxes stay
    # DATA on the WebSocket above rather than being burnt into these frames,
    # which is what lets them be toggled, filtered and clicked.
    #
    # enabled: false keeps the whole dashboard working and serves no pixels -
    # that is the pre-video behaviour, if the exposure is not one you want.
    enabled: true
    fps: 8               # encode ceiling. Independent of analyse_fps again:
                         # a clip replaying at 3x should not encode 90 fps for
                         # a viewer who can see eight.
    quality: 70          # JPEG quality. MEASURED on samples/short/indian_road.mp4
                         # (1080p, busy scene): 960 px at 70 is ~83 KB a frame,
                         # so ~4.3 Mbit/s per viewer at 8 fps. Drop this or
                         # max_width if that matters; a quiet scene costs far
                         # less, because JPEG size follows detail.
    max_width: 960       # downscale ceiling. ASPECT RATIO IS PRESERVED and
                         # has to be: the dashboard overlays a canvas sized to
                         # the camera's SOURCE resolution and lets CSS stretch
                         # both to one box, so a non-proportional resize would
                         # put every box a few pixels off its object.
    snapshot_fps: 1      # cadence when NOBODY is streaming. Encoding is
                         # skipped almost entirely with no viewers, but not
                         # completely, or /snapshot.jpg would serve whatever
                         # was current when the last tab closed.
  search:
    # OPEN-VOCABULARY SEARCH over embedded crops (the dashboard's search view).
    #
    # `model` is the single place the embedding space is named. It used to be
    # a constant in the server while tools/embed_crops.py defaulted to
    # something else, so running the embedder with no flags filled a space
    # nothing queried and search returned nothing with no error. Cosine is
    # only meaningful WITHIN one space, so two indexes can never cover for
    # each other - one name, here.
    model: "clip-vit-l14"    # or clip-vit-b16 (faster, lower p@5)

    # Embeddings are NOT built by the pipeline - no real-time decision needs
    # one, and keeping CLIP out of pipeline.py makes a model swap a script
    # re-run. The cost used to be a trap: a fresh database meant search
    # returned nothing until someone remembered to run the embedder by hand.
    # So the service indexes its own backlog on a thread, like the webhook
    # dispatcher and the retention reaper.
    #
    # OFF in this checkout: CLIP L/14 is ~317 ms/crop and competes for the same
    # CPU as recognition, plates and attributes on this laptop, so it stays off
    # while those are being run and tested (agreed with the brother). Turn it
    # back on here to index crops for search, or run tools/embed_crops.py by
    # hand when the machine is otherwise idle.
    embed_in_background: false

    # THE DUTY CYCLE, which is the whole safety mechanism. L/14 inference is
    # ~317 ms/crop on CPU and the cameras want that CPU, so this works in
    # bursts and then deliberately waits:
    #
    #     duty = work / (work + pause_s),  work ~= batch * 0.32s for L/14
    #
    # 8 and 3.0 give ~45%, about 1.4 crops/s against the CLI's 3.1. That is
    # intentionally slower: a backlog nobody is waiting on must not cost the
    # live feeds frame rate. pause_s: 0 runs flat out.
    batch: 8
    pause_s: 3.0
    idle_poll_s: 30        # how often to look for new crops once caught up

    # Which crops are eligible. Same floors as the CLI (shared code in
    # src/query/embed.py), each one a measurement decision - see that module.
    min_px: 48             # short side below this carries too few pixels
    min_conf: 0.5          # detection confidence of the crop's own frame
    max_area: 0.33         # a near-frame-sized box is the scene, not an object
